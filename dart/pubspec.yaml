name: squirrel_experiments
description: "Experiments and scratch drivers for squirrel parser error recovery"
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # The parser library the experiments were written against: the coarse
  # recovery tree. The other two trees are dart/noRecovery and dart/recovery.
  squirrel_parser:
    path: coarseRecovery

dev_dependencies:
  test: ^1.24.0
  lints: ^6.0.0
